name: Update Activity Graph

permissions:
    contents: write

on:
    schedule:
        - cron: '30 4 * * *' # Diario a las 04:30 UTC, después del workflow de badges
    workflow_dispatch:

jobs:
    generate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout del repo
              uses: actions/checkout@v7
              with:
                  persist-credentials: true

            - name: Generar SVG de Activity Graph (30 días)
              env:
                  GH_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                  set -euo pipefail
                  python3 scripts/activity_graph.py --user Jfernandez27 --days 30 --output README-activity.svg

            - name: Commit y push del SVG
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: 'chore: update Activity Graph (30 días)'
                  file_pattern: 'README-activity.svg'
                  token: ${{ secrets.GITHUB_TOKEN }}
